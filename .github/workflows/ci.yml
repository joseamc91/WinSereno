name: WinSereno CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: msbuild WinSereno.sln /m /nologo /p:Configuration=Release "/p:Platform=Any CPU"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WinSereno-Release
          path: bin/Release/WinSereno.exe
          if-no-files-found: error
